<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin Vs Padding</title>
  </head>
  <body style="background-color: rgb(129, 221, 164)">
    <main>
      <section>
        <div
          style="
            background-color: black;
            width: 100px;
            height: 100px;
            margin-top: 50px;
            padding-top: 10px;
          "
        >
          <div
            style="background-color: rgb(153, 6, 6); width: 40px; height: 40px"
          ></div>
        </div>
      </section>
    </main>
  </body>
</html>
