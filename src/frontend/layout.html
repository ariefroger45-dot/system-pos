<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS Kafe Pintar | Sistem Point of Sale</title>
    <link rel="stylesheet" href="../../assets/css/layout.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo-nav"><a href="#home>">Anime Artwork</a></div>
        <div class="page-nav">
          <a href="#design>">Home</a>
          <a href="#custom>">Product</a>
        </div>
      </nav>
    </header>

    <main class="layout">
      <section class="section-1">
        <div class="card-1">
          <div class="card-content-1">
            <img src="../../assets/images/anime1.jpg" alt="jeruk" />
            <div>
              <h1>Shocked</h1>
              <p>Printed tee available !</p>
            </div>
          </div>
          <div class="card-button">
            <button class="button">Add to Cart</button>
          </div>
        </div>
        <div class="card-1">
          <div class="card-content-1">
            <img src="../../assets/images/anime2.jpg" alt="lemon" />
            <div>
              <h1>Dizzy</h1>
              <p>Printed tee available !</p>
            </div>
          </div>
          <div class="card-button">
            <button class="button">Add to Cart</button>
          </div>
        </div>
      </section>
      <section class="section-2">
        <div class="card-2">
          <div class="card-content-2">
            <div class="container-img">
              <img src="../../assets/images/anime1.jpg" alt="jeruk" />
            </div>
            <div>
              <h1>Shocked</h1>
              <p>Printed tee available !</p>
            </div>
          </div>
          <div class="card-button card-right-button">
            <button class="button">Add to Cart</button>
          </div>
        </div>
        <div class="card-2">
          <div class="card-content-2">
            <div class="container-img">
              <img src="../../assets/images/anime2.jpg" alt="lemon" />
            </div>
            <div>
              <h1>Dizzy</h1>
              <p>Printed tee available !</p>
            </div>
          </div>
          <div class="card-button card-right-button">
            <button class="button">Add to Cart</button>
          </div>
        </div>
      </section>

      <a href="#cart" class="cart">
        <img src="../../assets/images/cart.png" alt="img-cart" />
      </a>
    </main>
    <footer class="footer">
      <div class="footer-bottom">
        <p>&copy; 2026 Logo. All Rights Reserved.</p>
      </div>
    </footer>
  </body>
</html>
